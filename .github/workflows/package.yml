name: Packages

# Builds the Linux standalone tarball and the Ubuntu .deb, smoke-tests both
# offscreen and keeps them as workflow artifacts. Nothing is published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15.1"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 desktop-file-utils
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: desktop-file-validate packaging/linux/unifi2netbox.desktop
      - run: bash tools/build_linux.sh
      - name: Install the .deb and smoke-test the installed launcher
        run: |
          sudo apt-get install -y ./dist/unifi2netbox_*_amd64.deb
          test -L /usr/bin/unifi2netbox
          test -f /usr/share/applications/unifi2netbox.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/unifi2netbox.png
          UNIFI2NETBOX_EXE=/usr/bin/unifi2netbox python -m pytest tests/test_package.py -q -p no:cacheprovider
          sudo apt-get remove -y unifi2netbox
          test ! -e /opt/unifi2netbox
      - uses: actions/upload-artifact@v4
        with:
          name: unifi2netbox-linux
          path: |
            dist/unifi2netbox_*_amd64.deb
            dist/unifi2netbox-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
