[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi2netbox"
version = "0.3.1"
description = "Review UniFi inventory changes before applying them to NetBox"
readme = "README.md"
requires-python = ">=3.15.1"
license = "MIT"
dependencies = [
    "PySide6==6.12.0",
    "pynetbox==7.9.0",
    "tomlkit==0.15.2",
    "platformdirs==4.13.5",
    "requests==2.34.2",
    "packaging==26.3",
    "httpx==0.28.1",
]

[project.scripts]
unifi2netbox = "unifi2netbox.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: explicitly opted-in live infrastructure checks"]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]