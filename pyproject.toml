[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi2netbox"
version = "1.4.2"
description = "Review UniFi inventory differences before applying selected changes to NetBox"
readme = "README.md"
requires-python = ">=3.15.1"
license = "MIT"
dependencies = [
    "PySide6==6.12.0",
    "pynetbox==7.9.0",
    "tomlkit==0.15.2",
    "platformdirs==4.13.5",
    "requests==2.34.2",
    "packaging==26.3",
    "httpx==0.28.1",
    "ruamel.yaml==0.19.1",
    "jsonschema==4.26.0",
]

[project.scripts]
unifi2netbox = "unifi2netbox.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unifi2netbox = [
    "resources/*.png",
    "resources/*.svg",
    "resources/*.ico",
    "resources/devicetype-schema/*.json",
    "resources/netbox-metadata/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: explicitly opted-in live infrastructure checks"]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
